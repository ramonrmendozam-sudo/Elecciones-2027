<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <!-- Metaetiqueta que prohíbe el zoom del usuario en pantallas táctiles -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Días para la Jornada Electoral</title>
    <style>
        /* Desactivar scroll y bloquear gestos táctiles de zoom */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            box-sizing: border-box;
            background-color: #ffffff;
            touch-action: none; /* Desactiva pellizcar para hacer zoom en pantallas táctiles */
        }

        *, *:before, *:after {
            box-sizing: inherit;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Contenedor flexible con zoom fijo al 150% */
        .main-card {
            background: #ffffff;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 10px 15px;
            zoom: 1.5; /* Escala interna fija al 150% */
        }

        /* Título con tamaño de fuente dinámico */
        .title {
            color: #002d62;
            font-size: clamp(1.1rem, 4vw, 2.2rem);
            font-weight: 700;
            margin-top: 0;
            margin-bottom: 4%;
            letter-spacing: -0.5px;
            line-height: 1.2;
            width: 100%;
        }

        /* Fila de tarjetas adaptable */
        .countdown-row {
            display: flex;
            justify-content: center;
            width: 100%;
            max-width: 600px;
            gap: 2.5%;
        }

        /* Fichas contenedoras */
        .time-card {
            background-color: #ffffff;
            border-radius: 12px;
            flex: 1;
            max-width: 120px;
            min-width: 50px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.04);
            overflow: visible; /* Permite que la flecha del fucsia sobresalga */
            position: relative;
            border: 1px solid #f1f3f5;
        }

        /* --- CABECERAS DE LAS TARJETAS (NUEVO) --- */
        .card-header {
            height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 11px 11px 0 0;
            position: relative;
        }

        /* Cabecera fucsia */
        .card-header.fuchsia-header {
            background-color: #d5007f;
            color: #ffffff;
        }

        /* Flecha indicadora hacia abajo de la primera tarjeta */
        .card-header.fuchsia-header::after {
            content: '';
            position: absolute;
            bottom: -6px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 6px solid transparent;
            border-right: 6px solid transparent;
            border-top: 6px solid #d5007f;
            z-index: 10;
        }

        /* Cabecera blanca/gris */
        .card-header.white-header {
            background-color: #f8f6fc;
            color: #002d62;
            border-bottom: 1px solid #ededf5;
        }

        /* --- CUERPO DE LAS TARJETAS (NUEVO) --- */
        .card-body {
            padding: 12px 6px 10px 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            flex-grow: 1;
        }

        /* Caja de números adaptada */
        .num-box {
            font-size: clamp(1.6rem, 5vw, 2.8rem);
            font-weight: 700;
            color: #d5007f;
            line-height: 1.1;
            margin-bottom: 6px;
        }

        /* Etiquetas inferiores en mayúsculas */
        .label-box {
            font-size: clamp(0.65rem, 1.8vw, 0.95rem);
            font-weight: 700;
            color: #002d62;
            text-align: center;
            white-space: nowrap;
            text-transform: uppercase; /* Convierte a mayúsculas como en la imagen */
            margin-bottom: 10px;
        }

        /* Línea indicadora inferior (fucsia) */
        .card-line {
            width: 16px;
            height: 2.5px;
            background-color: #d5007f;
            border-radius: 2px;
        }

        /* --- ESTILOS DE LA PLACA DE LA FECHA (PILL BADGE) --- */
        .date-badge-pill {
            background-color: #f3effa;
            border-radius: 50px;
            display: inline-flex;
            align-items: center;
            padding: 6px 20px 6px 6px;
            gap: 12px;
            margin-top: 25px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.02);
        }

        .badge-icon-circle {
            background-color: #d5007f;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .badge-text {
            color: #002d62;
            font-size: clamp(0.75rem, 2vw, 1.05rem);
            font-weight: 600;
            letter-spacing: -0.2px;
        }

        .badge-highlight {
            color: #d5007f;
            font-weight: 700;
        }
    </style>
</head>
<body>

    <div class="main-card">
        <h1 class="title">Días para la Jornada Electoral</h1>
        
        <div class="countdown-row">
            <!-- Ficha de Días (Tema Fucsia con Icono de Calendario) -->
            <div class="time-card">
                <div class="card-header fuchsia-header">
                    <!-- Icono de calendario blanco -->
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                        <line x1="16" y1="2" x2="16" y2="6"></line>
                        <line x1="8" y1="2" x2="8" y2="6"></line>
                        <line x1="3" y1="10" x2="21" y2="10"></line>
                        <path d="M8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01M16 18h.01"></path>
                    </svg>
                </div>
                <div class="card-body">
                    <div class="num-box" id="days-val">00</div>
                    <div class="label-box">Días</div>
                    <div class="card-line"></div>
                </div>
            </div>

            <!-- Ficha de Horas (Tema Blanco con Icono de Reloj) -->
            <div class="time-card">
                <div class="card-header white-header">
                    <!-- Icono de reloj azul oscuro -->
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#002d62" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"></circle>
                        <polyline points="12 6 12 12 16 14"></polyline>
                    </svg>
                </div>
                <div class="card-body">
                    <div class="num-box" id="hours-val">00</div>
                    <div class="label-box">Horas</div>
                    <div class="card-line"></div>
                </div>
            </div>

            <!-- Ficha de Minutos (Tema Blanco con Icono de Cronómetro) -->
            <div class="time-card">
                <div class="card-header white-header">
                    <!-- Icono de cronómetro azul oscuro -->
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#002d62" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="13" r="8"></circle>
                        <path d="M12 5V2M9 2h6M12 9v4l3 3"></path>
                    </svg>
                </div>
                <div class="card-body">
                    <div class="num-box" id="minutes-val">00</div>
                    <div class="label-box">Minutos</div>
                    <div class="card-line"></div>
                </div>
            </div>

            <!-- Ficha de Segundos (Tema Blanco con Icono de Cronómetro) -->
            <div class="time-card">
                <div class="card-header white-header">
                    <!-- Icono de cronómetro azul oscuro -->
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#002d62" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="13" r="8"></circle>
                        <path d="M12 5V2M9 2h6M12 9v4l3 3"></path>
                    </svg>
                </div>
                <div class="card-body">
                    <div class="num-box" id="seconds-val">00</div>
                    <div class="label-box">Segundos</div>
                    <div class="card-line"></div>
                </div>
            </div>
        </div>

        <!-- PLACA DE FECHA -->
        <div class="date-badge-pill">
            <div class="badge-icon-circle">
                <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                    <line x1="16" y1="2" x2="16" y2="6"></line>
                    <line x1="8" y1="2" x2="8" y2="6"></line>
                    <line x1="3" y1="10" x2="21" y2="10"></line>
                </svg>
            </div>
            <div class="badge-text">
                Fecha de la Jornada Electoral: <span class="badge-highlight">07 de junio de 2027</span>
            </div>
        </div>

    </div>

    <script>
        // --- BLOQUEO DE ZOOM DEL NAVEGADOR ---
        
        // 1. Bloquear zoom al usar Ctrl + Rueda del ratón
        document.addEventListener('wheel', function(event) {
            if (event.ctrlKey) {
                event.preventDefault();
            }
        }, { passive: false });

        // 2. Bloquear zoom con atajos de teclado (Ctrl + '+', Ctrl + '-', Ctrl + '0')
        document.addEventListener('keydown', function(event) {
            if (event.ctrlKey && (
                event.key === '=' || 
                event.key === '-' || 
                event.key === '+' || 
                event.key === '0' || 
                event.keyCode === 187 || 
                event.keyCode === 189 || 
                event.keyCode === 48 ||
                event.keyCode === 107 ||
                event.keyCode === 109
            )) {
                event.preventDefault();
            }
        });

        // 3. Bloquear gestos de zoom táctil (Pinch-to-zoom) en Mac/Windows Trackpads
        document.addEventListener('gesturestart', function(event) {
            event.preventDefault();
        });

        // --- LÓGICA DE LA CUENTA REGRESIVA ---
        (function() {
            const targetDate = new Date("June 7, 2027 08:00:00").getTime();

            const updateCountdown = setInterval(function() {
                const now = new Date().getTime();
                const difference = targetDate - now;

                const daysEl = document.getElementById("days-val");
                const hoursEl = document.getElementById("hours-val");
                const minutesEl = document.getElementById("minutes-val");
                const secondsEl = document.getElementById("seconds-val");

                if (!daysEl) {
                    clearInterval(updateCountdown);
                    return;
                }

                if (difference < 0) {
                    clearInterval(updateCountdown);
                    document.querySelector(".main-card").innerHTML = 
                        "<h1 class='title'>La Jornada Electoral ha comenzado</h1>";
                    return;
                }

                const days = Math.floor(difference / (1000 * 60 * 60 * 24));
                const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((difference % (1000 * 60)) / 1000);

                daysEl.innerText = days;
                hoursEl.innerText = hours < 10 ? "0" + hours : hours;
                minutesEl.innerText = minutes < 10 ? "0" + minutes : minutes;
                secondsEl.innerText = seconds < 10 ? "0" + seconds : seconds;
            }, 1000);
        })();
    </script>
</body>
</html>
